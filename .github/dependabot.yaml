version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: master
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    schedule:
      interval: daily

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: master
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    schedule:
      interval: daily
