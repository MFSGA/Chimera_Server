name: One-shot Hysteria2 baseline

on:
  push:
    branches:
      - codex/run-hy2-perf-baseline

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: "${{ github.event.head_commit.message == 'ci: run Hysteria2 baseline' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Hysteria2 performance workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(jq -n '{ref:"master",inputs:{rtts:"1,50,100,200",losses:"0,1,3",modes:"brutal,bbr,reno",bandwidth_mbps:"200",payload_mib:"8",runs:"1"}}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/hysteria2-performance.yml/dispatches" \
            -d "$payload"
