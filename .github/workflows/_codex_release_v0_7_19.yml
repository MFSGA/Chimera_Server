name: One-shot release v0.7.19

on:
  push:
    branches:
      - codex/release-v0.7.19

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: "${{ github.event.head_commit.message == 'ci: release v0.7.19' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare v0.7.19
        shell: bash
        env:
          EXPECTED_BASE: 54f122452421c4a6fe690b3e9988ba3c37b1e954
        run: |
          set -euo pipefail
          git fetch origin master --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/master)" = "$EXPECTED_BASE"

          python3 <<'PY'
          from pathlib import Path
          path = Path('Cargo.toml')
          text = path.read_text()
          old = '[workspace.package]\nversion = "0.7.18"'
          new = '[workspace.package]\nversion = "0.7.19"'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one workspace 0.7.18 version')
          path.write_text(text.replace(old, new, 1))
          PY

          cargo check --workspace --quiet
          cargo metadata --locked --format-version 1 --no-deps >/tmp/metadata.json
          test "$(jq -r '.packages[] | select(.name == "chimera_server_app") | .version' /tmp/metadata.json)" = "0.7.19"

          echo '=== release preparation changes ==='
          git status --short
          changed=$(git status --porcelain | awk '{print $2}' | sort)
          expected=$(printf '%s\n' Cargo.lock Cargo.toml | sort)
          test "$changed" = "$expected"

          git add Cargo.toml Cargo.lock
          git diff --cached --check
          git diff --cached --stat
          git commit -m "chore(release): prepare v0.7.19 Xray compatibility"

          git fetch origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED_BASE"
          git push origin HEAD:master

      - name: Dispatch repository release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(jq -n '{ref:"master",inputs:{version:"0.7.19",release_goal:"Hysteria2 Xray 26.7.28 compatibility",source_ref:""}}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -d "$payload"
