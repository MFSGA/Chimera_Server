name: Apply Brutal post-auth v2

on:
  push:
    branches:
      - codex/apply-brutal-post-auth-v2

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci: apply Brutal post-auth v2' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/hysteria2-brutal-post-auth-v2
          token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Apply controller transition
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/apply.b64 | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
          cargo fmt --all
          cargo test -p chimera_server_lib brutal_
          cargo fmt --all -- --check
          test "$(git status --porcelain | awk '{print $2}')" = "chimera_server_lib/src/handler/hysteria2/congestion.rs"
          git add chimera_server_lib/src/handler/hysteria2/congestion.rs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'perf(hysteria2): stop BBR after Brutal activation'
          git push origin HEAD:perf/hysteria2-brutal-post-auth-v2
