name: Auto-merge Dependabot updates

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [dismissed, edited, submitted]
  workflow_dispatch:
    inputs:
      merged_pr_number:
        description: Refresh eligible Dependabot PR branches after this merged PR
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  merge-dependabot-pr:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
      github.event.action != 'closed' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Merge eligible Dependabot dependency update
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          CHIMERA_AUTOMERGE_PROTECTION_CONFIRMED: ${{ vars.CHIMERA_AUTOMERGE_PROTECTION_CONFIRMED }}
        run: python3 .github/scripts/auto_merge_after_ci.py

  refresh-open-dependabot-prs:
    needs: [merge-dependabot-pr]
    if: >-
      always() &&
      (
        (github.event_name == 'pull_request_target' &&
        github.event.action == 'closed' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'master') ||
        (github.event_name == 'workflow_run' &&
        needs.merge-dependabot-pr.result == 'success' &&
        github.event.workflow_run.name == 'CI' &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' &&
        inputs.merged_pr_number > 0)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update remaining Dependabot PR branches
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOMERGE_MODE: refresh
        run: python3 .github/scripts/auto_merge_after_ci.py
