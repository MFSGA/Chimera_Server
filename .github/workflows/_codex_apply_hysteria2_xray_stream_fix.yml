name: Trace master Hysteria2 stream ownership

on:
  push:
    branches:
      - codex/hysteria2-xray-modern-streams

jobs:
  trace:
    if: "${{ github.event.head_commit.message == 'ci: trace master Hysteria2 stream ownership' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v26.7.28
            sha256: 8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40
          - version: v26.2.6
            sha256: 29ce535b56e207a406ffa1c2d4842dcc410be003eff8ec508bb732abc9f8e385
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
      - uses: Swatinem/rust-cache@v2
      - name: Instrument original raw Quinn TCP path
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('chimera_server_lib/src/handler/hysteria2/connection.rs')
          text = path.read_text()
          replacements = [
            (
              '''            Ok((send, recv)) => {\n''',
              '''            Ok((send, recv)) => {\n                debug!(stream_id = ?recv.id(), "hysteria2 master trace raw bidi accepted");\n'''
            ),
            (
              '''        Ok(request) => request,\n''',
              '''        Ok(request) => {\n            debug!(target = %request.target, "hysteria2 master trace request parsed");\n            request\n        },\n'''
            ),
            (
              '''    send_tcp_response(&mut send, TCP_SUCCESS_STATUS, "").await?;\n''',
              '''    debug!("hysteria2 master trace sending response");\n    send_tcp_response(&mut send, TCP_SUCCESS_STATUS, "").await?;\n    debug!("hysteria2 master trace response sent");\n'''
            ),
            (
              '''        Ok(Ok(Some(connection))) => connection,\n''',
              '''        Ok(Ok(Some(connection))) => {\n            debug!(target = %request.target, "hysteria2 master trace outbound connected");\n            connection\n        },\n'''
            ),
          ]
          for old, new in replacements:
              assert old in text, old
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Provision temporary test certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout cert/key.pem -out cert/cert.pem -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Download and verify Xray
        shell: bash
        env:
          XRAY_VERSION: ${{ matrix.version }}
          XRAY_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="/tmp/Xray-linux-64-${XRAY_VERSION}.zip"
          curl -fL --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            -o "$archive"
          echo "${XRAY_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" -d xray-test
          cp xray-test/xray ./xray
          chmod +x ./xray
          ./xray version
      - name: Hysteria2 TCP ownership trace
        shell: bash
        env:
          XRAY_BIN: ${{ github.workspace }}/xray
          RUST_BACKTRACE: '1'
        run: |
          set +e
          cargo test -p chimera_server_app --test xray_client_proxy_e2e \
            xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2 \
            -- --ignored --exact --nocapture
          status=$?
          echo '=== Hysteria2 diagnostics ==='
          find /tmp -type f -path '*hysteria2*' \
            \( -name '*.log' -o -name '*.json' -o -name '*.json5' \) \
            -print -exec sh -c 'echo "--- $1 ---"; tail -n 400 "$1"' _ {} \; 2>/dev/null || true
          exit "$status"
