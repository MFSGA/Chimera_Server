name: Isolate Brutal minimum window

on:
  push:
    branches:
      - codex/hysteria2-xray-modern-streams

jobs:
  diagnose:
    if: "${{ github.event.head_commit.message == 'ci: isolate Brutal minimum window' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, min-2mtu, min-10mtu, multiplier-2, multiplier-2-min-2mtu]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
      - uses: Swatinem/rust-cache@v2
      - name: Apply Brutal variant
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path
          variant = os.environ['VARIANT']
          path = Path('chimera_server_lib/src/handler/hysteria2/congestion.rs')
          text = path.read_text()
          if variant in ('multiplier-2', 'multiplier-2-min-2mtu'):
              text = text.replace('const CONGESTION_WINDOW_MULTIPLIER: f64 = 0.8;', 'const CONGESTION_WINDOW_MULTIPLIER: f64 = 2.0;')
          if variant in ('min-2mtu', 'multiplier-2-min-2mtu'):
              text = text.replace('(cwnd as u64).max(self.max_datagram_size)', '(cwnd as u64).max(self.max_datagram_size.saturating_mul(2))')
          elif variant == 'min-10mtu':
              text = text.replace('(cwnd as u64).max(self.max_datagram_size)', '(cwnd as u64).max(self.max_datagram_size.saturating_mul(10))')
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Provision temporary test certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout cert/key.pem -out cert/cert.pem -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Download and verify Xray v26.7.28
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip' -o /tmp/xray.zip
          echo '8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40  /tmp/xray.zip' | sha256sum -c -
          unzip -q /tmp/xray.zip -d xray-test
          cp xray-test/xray ./xray
          chmod +x ./xray
          ./xray version
      - name: Hysteria2 repeated TCP and UDP interop
        env:
          XRAY_BIN: ${{ github.workspace }}/xray
        run: |
          cargo test -p chimera_server_app --test xray_client_proxy_e2e \
            xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2 \
            -- --ignored --exact --nocapture
