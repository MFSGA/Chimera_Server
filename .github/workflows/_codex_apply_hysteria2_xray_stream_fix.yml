name: Validate Brutal low-rtt fix

on:
  push:
    branches:
      - codex/hysteria2-xray-modern-streams

jobs:
  quality:
    if: "${{ github.event.head_commit.message == 'ci: validate Brutal low-rtt fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/hysteria2-xray-brutal-window
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build all features
        run: cargo build --all-features
      - name: Clippy all targets and features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test
      - name: Test locked
        run: cargo test --locked

  interop:
    if: "${{ github.event.head_commit.message == 'ci: validate Brutal low-rtt fix' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v26.7.28
            sha256: 8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40
          - version: v26.3.27
            sha256: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
          - version: v26.2.6
            sha256: 29ce535b56e207a406ffa1c2d4842dcc410be003eff8ec508bb732abc9f8e385
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/hysteria2-xray-brutal-window
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
      - uses: Swatinem/rust-cache@v2
      - name: Provision temporary test certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout cert/key.pem -out cert/cert.pem -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Download and verify Xray
        shell: bash
        env:
          XRAY_VERSION: ${{ matrix.version }}
          XRAY_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="/tmp/Xray-linux-64-${XRAY_VERSION}.zip"
          curl -fL --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            -o "$archive"
          echo "${XRAY_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" -d xray-test
          cp xray-test/xray ./xray
          chmod +x ./xray
          ./xray version
      - name: Hysteria2 Brutal TCP and UDP interop
        env:
          XRAY_BIN: ${{ github.workspace }}/xray
        run: |
          cargo test -p chimera_server_app --test xray_client_proxy_e2e \
            xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2 \
            -- --ignored --exact --nocapture
