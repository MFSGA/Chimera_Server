name: Apply Brutal window compatibility fix

on:
  push:
    branches:
      - codex/hysteria2-xray-modern-streams

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci: apply Brutal window compatibility fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/hysteria2-xray-brutal-window
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
      - uses: Swatinem/rust-cache@v2
      - name: Apply fix and regression tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('chimera_server_lib/src/handler/hysteria2/congestion.rs')
          text = path.read_text()
          text = text.replace(
              'const DEFAULT_CONGESTION_WINDOW: u64 = 10_240;\n',
              '''const DEFAULT_CONGESTION_WINDOW: u64 = 10_240;\n// Xray Brutal allows another datagram when bytes-in-flight is exactly cwnd.\n// Quinn treats `window()` as a hard maximum for ack-eliciting bytes in flight,\n// so preserve Xray's effective one-extra-datagram allowance at the minimum.\nconst MIN_CONGESTION_WINDOW_DATAGRAMS: u64 = 2;\n''',
              1,
          )
          text = text.replace(
              '        (cwnd as u64).max(self.max_datagram_size)\n',
              '''        (cwnd as u64).max(\n            self.max_datagram_size\n                .saturating_mul(MIN_CONGESTION_WINDOW_DATAGRAMS),\n        )\n''',
              1,
          )
          text += '''\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn brutal_low_rtt_window_preserves_xray_send_allowance() {\n        let now = Instant::now();\n        let mut state = BrutalState::new(now, 1200);\n        state.last_rtt = Duration::from_micros(100);\n\n        // At Xray's minimum valid Brutal rate this RTT would otherwise collapse\n        // Quinn's strict in-flight window to a single datagram.\n        assert_eq!(state.window(65_536), 2400);\n\n        state.on_mtu_update(1450);\n        assert_eq!(state.window(65_536), 2900);\n    }\n\n    #[test]\n    fn brutal_rate_derived_window_is_unchanged_above_minimum() {\n        let now = Instant::now();\n        let mut state = BrutalState::new(now, 1200);\n        state.last_rtt = Duration::from_millis(100);\n\n        assert_eq!(state.window(1_000_000), 80_000);\n    }\n}\n'''
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Focused Brutal tests
        run: cargo test -p chimera_server_lib brutal_
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MFSGA
          git config user.email chimera_rust@proton.me
          git add chimera_server_lib/src/handler/hysteria2/congestion.rs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(hysteria2): prevent Brutal low-rtt stalls'
          git push origin HEAD:codex/hysteria2-xray-brutal-window
