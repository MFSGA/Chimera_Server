name: Trace Xray 26.7.28 client stages

on:
  push:
    branches:
      - codex/hysteria2-xray-modern-streams

jobs:
  trace:
    if: "${{ github.event.head_commit.message == 'ci: trace Xray 26.7.28 client stages' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
      - uses: Swatinem/rust-cache@v2
      - name: Enable diagnostic logs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('chimera_server_lib/src/handler/hysteria2/connection.rs')
          text = path.read_text()
          text = text.replace(
              '            Ok((send, recv)) => {\n',
              '            Ok((send, recv)) => {\n                debug!(stream_id = ?recv.id(), "hysteria2 trace raw bidi accepted");\n',
              1,
          )
          text = text.replace(
              '        Ok(request) => request,\n',
              '        Ok(request) => { debug!(target = %request.target, "hysteria2 trace request parsed"); request },\n',
              1,
          )
          path.write_text(text)

          test = Path('chimera_server_app/tests/xray_client_proxy_e2e.rs')
          text = test.read_text()
          start = text.index('async fn xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2()')
          end = text.index('\n#[test]\n#[ignore = "starts Chimera as server and ./xray with invalid hysteria2 auth"]', start)
          section = text[start:end]
          section = section.replace('"loglevel": "warning"', '"loglevel": "debug"')
          text = text[:start] + section + text[end:]
          test.write_text(text)
          PY
          cargo fmt --all
      - name: Provision temporary test certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout cert/key.pem -out cert/cert.pem -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Download and verify Xray v26.7.28
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip' \
            -o /tmp/xray.zip
          echo '8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40  /tmp/xray.zip' | sha256sum -c -
          unzip -q /tmp/xray.zip -d xray-test
          cp xray-test/xray ./xray
          chmod +x ./xray
          ./xray version
      - name: Hysteria2 TCP trace
        shell: bash
        env:
          XRAY_BIN: ${{ github.workspace }}/xray
          RUST_BACKTRACE: '1'
        run: |
          set +e
          cargo test -p chimera_server_app --test xray_client_proxy_e2e \
            xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2 \
            -- --ignored --exact --nocapture
          status=$?
          echo '=== Hysteria2 diagnostics ==='
          find /tmp -type f -path '*hysteria2*' \
            \( -name '*.log' -o -name '*.json' -o -name '*.json5' \) \
            -print -exec sh -c 'echo "--- $1 ---"; tail -n 500 "$1"' _ {} \; 2>/dev/null || true
          exit "$status"
