name: Trace modern Xray Hysteria2 TCP stages

on:
  push:
    branches:
      - codex/hysteria2-xray-modern-streams

jobs:
  trace:
    if: "${{ github.event.head_commit.message == 'ci: trace modern Xray Hysteria2 TCP stages' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
      - uses: Swatinem/rust-cache@v2
      - name: Instrument TCP stages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('chimera_server_lib/src/handler/hysteria2/connection.rs')
          text = path.read_text()

          replacements = [
            (
              '''            Ok(stream) => stream,\n''',
              '''            Ok(stream) => {\n                debug!(stream_id = ?H3RecvStream::recv_id(&stream), "hysteria2 trace bidi accepted");\n                stream\n            },\n'''
            ),
            (
              '''        Ok(request) => request,\n''',
              '''        Ok(request) => {\n            debug!(target = %request.target, "hysteria2 trace tcp request parsed");\n            request\n        },\n'''
            ),
            (
              '''    send_tcp_response(&mut stream, TCP_SUCCESS_STATUS, "").await?;\n''',
              '''    debug!("hysteria2 trace sending tcp response");\n    send_tcp_response(&mut stream, TCP_SUCCESS_STATUS, "").await?;\n    debug!("hysteria2 trace tcp response sent");\n'''
            ),
            (
              '''    let connection = match tokio::time::timeout(\n''',
              '''    debug!(target = %request.target, "hysteria2 trace connecting outbound");\n    let connection = match tokio::time::timeout(\n'''
            ),
            (
              '''        Ok(Ok(Some(connection))) => connection,\n''',
              '''        Ok(Ok(Some(connection))) => {\n            debug!(target = %request.target, "hysteria2 trace outbound connected");\n            connection\n        },\n'''
            ),
            (
              '''    proxy_tcp(stream, connection.stream, context).await\n''',
              '''    debug!("hysteria2 trace starting tcp proxy");\n    proxy_tcp(stream, connection.stream, context).await\n'''
            ),
            (
              '''        match SendStreamUnframed::poll_send(&mut this.stream, cx, &mut data) {\n            Poll::Ready(Ok(written)) => Poll::Ready(Ok(written)),\n''',
              '''        debug!(len = buf.len(), prefix = ?&buf[..buf.len().min(16)], "hysteria2 trace poll_write");\n        match SendStreamUnframed::poll_send(&mut this.stream, cx, &mut data) {\n            Poll::Ready(Ok(written)) => {\n                debug!(written, "hysteria2 trace poll_write complete");\n                Poll::Ready(Ok(written))\n            },\n'''
            ),
          ]
          for old, new in replacements:
              assert old in text, old
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Provision temporary test certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout cert/key.pem -out cert/cert.pem -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Download and verify Xray v26.7.28
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/Xray-linux-64-v26.7.28.zip
          curl -fL --retry 3 \
            'https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip' \
            -o "$archive"
          echo '8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40  /tmp/Xray-linux-64-v26.7.28.zip' | sha256sum -c -
          unzip -q "$archive" -d xray-test
          cp xray-test/xray ./xray
          chmod +x ./xray
          ./xray version
      - name: Hysteria2 TCP trace
        shell: bash
        env:
          XRAY_BIN: ${{ github.workspace }}/xray
          RUST_BACKTRACE: '1'
        run: |
          set +e
          cargo test -p chimera_server_app --test xray_client_proxy_e2e \
            xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2 \
            -- --ignored --exact --nocapture
          status=$?
          echo '=== Hysteria2 diagnostics ==='
          find /tmp -type f -path '*hysteria2*' \
            \( -name '*.log' -o -name '*.json' -o -name '*.json5' \) \
            -print -exec sh -c 'echo "--- $1 ---"; tail -n 400 "$1"' _ {} \; 2>/dev/null || true
          exit "$status"
