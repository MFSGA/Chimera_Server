name: Isolate modern Xray repeated stream failure

on:
  push:
    branches:
      - codex/hysteria2-xray-modern-streams

jobs:
  diagnose:
    if: "${{ github.event.head_commit.message == 'ci: isolate modern Xray repeated stream failure' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, no-uni-drain, server-bbr]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
      - uses: Swatinem/rust-cache@v2
      - name: Apply diagnostic variant
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          variant = os.environ['VARIANT']
          path = Path('chimera_server_lib/src/handler/hysteria2/connection.rs')
          text = path.read_text()

          # Correlate each QUIC stream through every TCP handling stage.
          text = text.replace(
              '''            Ok((send, recv)) => {\n''',
              '''            Ok((send, recv)) => {\n                let stream_id = recv.id();\n                debug!(?stream_id, "hy2diag accepted");\n''',
              1,
          )
          text = text.replace(
              '''            if let Err(err) = handle_tcp_stream(\n''',
              '''            debug!(?stream_id, "hy2diag handler start");\n            if let Err(err) = handle_tcp_stream(\n''',
              1,
          )
          text = text.replace(
              '''        Ok(request) => request,\n''',
              '''        Ok(request) => {\n            debug!(stream_id = ?recv.id(), target = %request.target, "hy2diag parsed");\n            request\n        },\n''',
              1,
          )
          text = text.replace(
              '''    send_tcp_response(&mut send, TCP_SUCCESS_STATUS, "").await?;\n''',
              '''    debug!(stream_id = ?recv.id(), "hy2diag response start");\n    send_tcp_response(&mut send, TCP_SUCCESS_STATUS, "").await?;\n    debug!(stream_id = ?recv.id(), "hy2diag response done");\n''',
              1,
          )
          text = text.replace(
              '''    let connection = match tokio::time::timeout(\n''',
              '''    debug!(stream_id = ?recv.id(), target = %request.target, "hy2diag connect start");\n    let connection = match tokio::time::timeout(\n''',
              1,
          )
          text = text.replace(
              '''        Ok(Ok(Some(connection))) => connection,\n''',
              '''        Ok(Ok(Some(connection))) => {\n            debug!(stream_id = ?recv.id(), "hy2diag connect done");\n            connection\n        },\n''',
              1,
          )
          text = text.replace(
              '''    proxy_tcp(send, recv, connection.stream, context).await\n''',
              '''    debug!(stream_id = ?recv.id(), "hy2diag proxy start");\n    let result = proxy_tcp(send, recv, connection.stream, context).await;\n    debug!(stream_id = ?stream_id_for_result, ?result, "hy2diag proxy end");\n    result\n'''.replace('stream_id_for_result', 'recv_id_placeholder'),
              1,
          ) if False else text

          # Insert proxy-start without moving recv after reading its id.
          old = '''    proxy_tcp(send, recv, connection.stream, context).await\n'''
          new = '''    let stream_id = recv.id();\n    debug!(?stream_id, "hy2diag proxy start");\n    let result = proxy_tcp(send, recv, connection.stream, context).await;\n    debug!(?stream_id, ?result, "hy2diag proxy end");\n    result\n'''
          assert old in text
          text = text.replace(old, new, 1)

          if variant == 'no-uni-drain':
              text = text.replace('''            drain_unidirectional_streams(connection),\n''', '', 1)
              text = text.replace('''            drain_unidirectional_streams(connection),\n''', '', 1)
          path.write_text(text)

          test = Path('chimera_server_app/tests/xray_client_proxy_e2e.rs')
          text = test.read_text()
          start = text.index('async fn xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2()')
          end = text.index('\n#[test]\n#[ignore = "starts Chimera as server and ./xray with invalid hysteria2 auth"]', start)
          section = text[start:end]
          if variant == 'server-bbr':
              marker = '"congestion": "brutal"'
              pos = section.index(marker)
              section = section[:pos] + '"congestion": "bbr"' + section[pos + len(marker):]
          text = text[:start] + section + text[end:]
          test.write_text(text)
          PY
          cargo fmt --all
      - name: Provision temporary test certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout cert/key.pem -out cert/cert.pem -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Download and verify Xray v26.7.28
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip' \
            -o /tmp/xray.zip
          echo '8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40  /tmp/xray.zip' | sha256sum -c -
          unzip -q /tmp/xray.zip -d xray-test
          cp xray-test/xray ./xray
          chmod +x ./xray
          ./xray version
      - name: Repeated TCP and UDP interop
        shell: bash
        env:
          XRAY_BIN: ${{ github.workspace }}/xray
          RUST_BACKTRACE: '1'
          RUST_LOG: chimera_server_lib::handler::hysteria2::connection=debug,chimera_server_lib=info,quinn=warn,rustls=warn
        run: |
          set +e
          cargo test -p chimera_server_app --test xray_client_proxy_e2e \
            xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2 \
            -- --ignored --exact --nocapture
          status=$?
          echo '=== focused Hysteria2 stage trace ==='
          find /tmp -type f -path '*hysteria2*' -name 'chimera.stderr.log' -exec grep -E 'hy2diag|hysteria2 tcp stream forwarded|auth (accepted|response finished)' {} \; || true
          exit "$status"
