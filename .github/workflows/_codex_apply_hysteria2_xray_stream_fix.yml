name: Apply Xray Hysteria2 stream compatibility fix

on:
  push:
    branches:
      - codex/hysteria2-xray-modern-streams

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: run Hysteria2 compatibility edit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/hysteria2-xray-modern-streams
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
      - uses: Swatinem/rust-cache@v2
      - name: Apply compatibility fix
        run: python3 .github/scripts/_codex_apply_hysteria2_xray_stream_fix.py
      - name: Format
        run: cargo fmt --all
      - name: Focused tests
        run: cargo test -p chimera_server_lib tcp_request_parser_accepts_xray_raw_stream_format
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MFSGA
          git config user.email chimera_rust@proton.me
          git add chimera_server_lib/src/handler/hysteria2/connection.rs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(hysteria2): accept modern Xray TCP streams'
          git push origin HEAD:codex/hysteria2-xray-modern-streams
