name: One-shot Hysteria2 UDP default fix

on:
  push:
    branches:
      - codex/hysteria2-udp-idle-timeout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/hysteria2-udp-idle-timeout
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply default parity fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('chimera_server_lib/src/config/server_config/builder/collectors.rs')
          s = p.read_text()
          start_marker = '    let xray_udp_idle_timeout_secs = hysteria_settings\n'
          end_marker = '        .transpose()?;\n'
          start = s.index(start_marker)
          end = s.index(end_marker, start) + len(end_marker)
          new = (
              '    let xray_udp_idle_timeout_secs = Some(match hysteria_settings {\n'
              '        Some(settings) => {\n'
              '            let timeout = settings.udp_idle_timeout;\n'
              '            if timeout != 0 && !(2..=600).contains(&timeout) {\n'
              '                return Err(Error::InvalidConfig(format!(\n'
              '                    "hysteriaSettings.udpIdleTimeout must be 0 or between 2 and 600 seconds (got {timeout})"\n'
              '                )));\n'
              '            }\n'
              '            if timeout == 0 { 60 } else { timeout as u64 }\n'
              '        }\n'
              '        None => 60,\n'
              '    });\n'
          )
          s = s[:start] + new + s[end:]
          needle = '        assert_eq!(config.clients[0].email.as_deref(), Some("hy@example.com"));\n'
          replacement = needle + '        assert_eq!(config.xray_udp_idle_timeout_secs, Some(60));\n'
          if needle not in s:
              raise SystemExit('collector auth assertion not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY
          cargo fmt --all
          rm .github/workflows/_codex_udp_default_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(hysteria2): preserve UDP idle default"
          git push origin HEAD:codex/hysteria2-udp-idle-timeout
