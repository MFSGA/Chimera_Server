name: One-shot rustfmt

on:
  push:
    branches:
      - codex/hysteria2-udp-idle-timeout

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/hysteria2-udp-idle-timeout
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and remove formatter workflow
        run: |
          cargo fmt --all
          rm .github/workflows/_codex_fmt_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: apply rustfmt"
          git push origin HEAD:codex/hysteria2-udp-idle-timeout
