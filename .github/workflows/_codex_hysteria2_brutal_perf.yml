name: One-shot Hysteria2 Brutal perf validation

on:
  push:
    branches:
      - codex/hysteria2-brutal-post-auth

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/hysteria2-brutal-post-auth
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: arduino/setup-protoc@v3
        with:
          version: 23.x
      - name: Apply post-auth Brutal optimization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('chimera_server_lib/src/handler/hysteria2/congestion.rs')
          s = path.read_text()

          old = '''        Box::new(BrutalController {
            tx_bps: self.tx_bps.clone(),
            brutal: BrutalState::new(now, current_mtu),
            bbr: Bbr::new(self.bbr_config.clone(), current_mtu),
        })
'''
          new = '''        Box::new(BrutalController {
            tx_bps: self.tx_bps.clone(),
            brutal: BrutalState::new(now, current_mtu),
            bbr: Some(Bbr::new(self.bbr_config.clone(), current_mtu)),
            current_mtu,
            brutal_active: false,
        })
'''
          if old not in s:
              raise SystemExit('factory marker not found')
          s = s.replace(old, new, 1)

          old = '''#[derive(Clone)]
struct BrutalController {
    tx_bps: Arc<AtomicU64>,
    brutal: BrutalState,
    bbr: Bbr,
}

impl BrutalController {
    fn use_brutal(&self) -> bool {
        self.tx_bps.load(Ordering::Relaxed) > 0
    }
}
'''
          new = '''#[derive(Clone)]
struct BrutalController {
    tx_bps: Arc<AtomicU64>,
    brutal: BrutalState,
    bbr: Option<Bbr>,
    current_mtu: u16,
    brutal_active: bool,
}

impl BrutalController {
    fn brutal_requested(&self) -> bool {
        self.tx_bps.load(Ordering::Relaxed) > 0
    }

    fn use_brutal(&self) -> bool {
        self.brutal_active || self.brutal_requested()
    }

    fn activate_brutal_if_configured(&mut self, now: Instant) {
        if self.brutal_active || !self.brutal_requested() {
            return;
        }

        // Xray replaces BBR with a fresh Brutal sender after authentication.
        // Reset samples at the same boundary and drop BBR so post-auth packet
        // processing pays only for the congestion controller that is in use.
        self.brutal = BrutalState::new(now, self.current_mtu);
        self.bbr = None;
        self.brutal_active = true;
    }
}
'''
          if old not in s:
              raise SystemExit('controller marker not found')
          s = s.replace(old, new, 1)

          start = s.index('impl Controller for BrutalController {')
          end = s.index('\n#[derive(Clone, Copy, Default)]\nstruct PacketInfo', start)
          old = s[start:end]
          new = '''impl Controller for BrutalController {
    fn on_sent(&mut self, now: Instant, bytes: u64, last_packet_number: u64) {
        self.activate_brutal_if_configured(now);
        if let Some(bbr) = self.bbr.as_mut() {
            bbr.on_sent(now, bytes, last_packet_number);
        }
    }

    fn on_ack(
        &mut self,
        now: Instant,
        sent: Instant,
        bytes: u64,
        app_limited: bool,
        rtt: &RttEstimator,
    ) {
        self.activate_brutal_if_configured(now);
        if let Some(bbr) = self.bbr.as_mut() {
            bbr.on_ack(now, sent, bytes, app_limited, rtt);
        } else {
            self.brutal.on_ack(now, rtt);
        }
    }

    fn on_end_acks(
        &mut self,
        now: Instant,
        in_flight: u64,
        app_limited: bool,
        largest_packet_num_acked: Option<u64>,
    ) {
        self.activate_brutal_if_configured(now);
        if let Some(bbr) = self.bbr.as_mut() {
            bbr.on_end_acks(
                now,
                in_flight,
                app_limited,
                largest_packet_num_acked,
            );
        }
    }

    fn on_congestion_event(
        &mut self,
        now: Instant,
        sent: Instant,
        is_persistent_congestion: bool,
        lost_bytes: u64,
    ) {
        self.activate_brutal_if_configured(now);
        if let Some(bbr) = self.bbr.as_mut() {
            bbr.on_congestion_event(
                now,
                sent,
                is_persistent_congestion,
                lost_bytes,
            );
        } else {
            self.brutal.on_congestion_event(now, lost_bytes);
        }
    }

    fn on_mtu_update(&mut self, new_mtu: u16) {
        self.current_mtu = new_mtu;
        if let Some(bbr) = self.bbr.as_mut() {
            bbr.on_mtu_update(new_mtu);
        } else {
            self.brutal.on_mtu_update(new_mtu);
        }
    }

    fn window(&self) -> u64 {
        if self.use_brutal() {
            self.brutal.window(self.tx_bps.load(Ordering::Relaxed))
        } else {
            self.bbr
                .as_ref()
                .expect("BBR must exist before Brutal activation")
                .window()
        }
    }

    fn clone_box(&self) -> Box<dyn Controller> {
        Box::new(self.clone())
    }

    fn initial_window(&self) -> u64 {
        if self.use_brutal() {
            self.brutal.initial_window()
        } else {
            self.bbr
                .as_ref()
                .expect("BBR must exist before Brutal activation")
                .initial_window()
        }
    }

    fn into_any(self: Box<Self>) -> Box<dyn Any> {
        self
    }
}
'''
          s = s[:start] + new + s[end:]

          tests = r'''

#[cfg(test)]
mod tests {
    use super::*;

    fn controller(tx_bps: Arc<AtomicU64>, now: Instant) -> BrutalController {
        let current_mtu = 1200;
        BrutalController {
            tx_bps,
            brutal: BrutalState::new(now, current_mtu),
            bbr: Some(Bbr::new(
                Arc::new(BbrConfig::default()),
                current_mtu,
            )),
            current_mtu,
            brutal_active: false,
        }
    }

    #[test]
    fn brutal_activation_drops_bbr_and_resets_pre_auth_state() {
        let tx_bps = Arc::new(AtomicU64::new(0));
        let now = Instant::now();
        let mut controller = controller(tx_bps.clone(), now);
        controller.brutal.last_rtt = Duration::from_millis(80);
        controller.brutal.ack_rate = MIN_ACK_RATE;
        controller.brutal.slots[0] = PacketInfo {
            timestamp: 1,
            ack_count: 40,
            loss_count: 10,
        };

        tx_bps.store(1_000_000, Ordering::Relaxed);
        let activated_at = now + Duration::from_secs(2);
        controller.activate_brutal_if_configured(activated_at);

        assert!(controller.brutal_active);
        assert!(controller.bbr.is_none());
        assert_eq!(controller.brutal.start, activated_at);
        assert_eq!(controller.brutal.last_rtt, Duration::ZERO);
        assert_eq!(controller.brutal.ack_rate, 1.0);
        assert!(controller.brutal.slots.iter().all(|slot| {
            slot.ack_count == 0 && slot.loss_count == 0
        }));
    }

    #[test]
    fn zero_brutal_bandwidth_keeps_bbr_fallback() {
        let tx_bps = Arc::new(AtomicU64::new(0));
        let now = Instant::now();
        let mut controller = controller(tx_bps, now);

        controller.activate_brutal_if_configured(now + Duration::from_secs(1));

        assert!(!controller.brutal_active);
        assert!(controller.bbr.is_some());
    }
}
'''
          if 'brutal_activation_drops_bbr_and_resets_pre_auth_state' in s:
              raise SystemExit('tests already present')
          s += tests
          path.write_text(s)
          PY
          cargo fmt --all
      - name: Focused Brutal tests
        run: cargo test -p chimera_server_lib brutal_
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build all features
        run: cargo build --all-features
      - name: Clippy all targets and features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test
      - name: Test locked
        run: cargo test --locked
      - name: Download Xray
        run: |
          VERSION=$(cat bench/.xray-version)
          mkdir -p xray
          curl -L "https://github.com/XTLS/Xray-core/releases/download/$VERSION/Xray-linux-64.zip" -o /tmp/xray.zip
          unzip -o /tmp/xray.zip -d xray/
          chmod +x xray/xray
          ./xray/xray version
      - name: Xray Hysteria2 Brutal TCP and UDP interop
        run: |
          cargo test -p chimera_server_app --test xray_client_proxy_e2e \
            xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2 \
            -- --ignored --exact --nocapture
      - name: Commit validated optimization and remove workflow
        run: |
          rm .github/workflows/_codex_hysteria2_brutal_perf.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chimera_server_lib/src/handler/hysteria2/congestion.rs
          git add -u .github/workflows/_codex_hysteria2_brutal_perf.yml
          git commit -m "perf(hysteria2): stop BBR after Brutal activation"
          git push origin HEAD:codex/hysteria2-brutal-post-auth
