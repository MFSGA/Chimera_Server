name: One-shot Hysteria2 gates

on:
  push:
    branches:
      - codex/hysteria2-udp-idle-timeout

permissions:
  contents: write

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/hysteria2-udp-idle-timeout
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: arduino/setup-protoc@v3
        with:
          version: 23.x
      - name: Apply final Hysteria2 fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          grpc = Path('chimera_server_lib/src/grpc/handler.rs')
          s = grpc.read_text()
          needle = '                    xray_max_idle_timeout_secs: None,\n                    xray_max_incoming_streams: None,\n'
          replacement = '                    xray_max_idle_timeout_secs: None,\n                    xray_udp_idle_timeout_secs: None,\n                    xray_max_incoming_streams: None,\n'
          if needle not in s:
              raise SystemExit('gRPC Hysteria2 fixture marker not found')
          grpc.write_text(s.replace(needle, replacement, 1))

          conn = Path('chimera_server_lib/src/handler/hysteria2/connection.rs')
          s = conn.read_text()
          early = '        session.mark_active();\n\n        if remote_location != session.last_location {\n'
          if early not in s:
              raise SystemExit('early UDP activity marker not found')
          s = s.replace(early, '        if remote_location != session.last_location {\n', 1)
          route = '        let route_input = connection_routing_input(\n'
          if route not in s:
              raise SystemExit('UDP routing marker not found')
          s = s.replace(route, '        session.mark_active();\n\n' + route, 1)
          conn.write_text(s)
          PY
          cargo fmt --all
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build all features
        run: cargo build --all-features
      - name: Clippy all targets and features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test
      - name: Test locked
        run: cargo test --locked
      - name: Commit validated fixes and remove workflow
        run: |
          rm .github/workflows/_codex_hysteria2_gates_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(hysteria2): align UDP activity tracking"
          git push origin HEAD:codex/hysteria2-udp-idle-timeout
