name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer increment to publish"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      release_goal:
        description: "Single primary protocol goal completed by this version"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      base_commit: ${{ steps.prepare.outputs.base_commit }}
      candidate_commit: ${{ steps.prepare.outputs.candidate_commit }}
      candidate_branch: ${{ steps.prepare.outputs.candidate_branch }}
      workspace_version: ${{ steps.prepare.outputs.workspace_version }}
      base_version: ${{ steps.prepare.outputs.base_version }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      release_goal: ${{ steps.prepare.outputs.release_goal }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute version and create candidate
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_GOAL: ${{ inputs.release_goal }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF_NAME" == "master" ]] || {
            echo "releases must be dispatched from master" >&2
            exit 1
          }
          [[ -n "${RELEASE_GOAL// }" && "$RELEASE_GOAL" != *$'\n'* ]] || {
            echo "release_goal must be one non-empty line" >&2
            exit 1
          }

          git fetch origin master --tags
          base_commit=$(git rev-parse origin/master)
          dispatch_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          [[ "$dispatch_commit" == "$base_commit" ]] || {
            echo "master advanced after this release was dispatched" >&2
            echo "dispatch: $dispatch_commit" >&2
            echo "current:  $base_commit" >&2
            echo "dispatch a fresh release from the current master" >&2
            exit 1
          }

          python3 .github/scripts/release_version.py \
            --bump "$BUMP" \
            --write \
            --github-output "$GITHUB_OUTPUT"

          version=$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_workspace = 1; next }
            /^\[/ { in_workspace = 0 }
            in_workspace && /^version = / { print $2; exit }
          ' Cargo.toml)
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null || \
             git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "release tag already exists: $tag" >&2
            exit 1
          fi

          # The helper updates only workspace package versions in Cargo.lock. Prove the
          # resulting committed lockfile is self-consistent without allowing dependency drift.
          cargo metadata --format-version 1 --no-deps --locked >/dev/null

          unexpected=$(git diff --name-only | grep -Ev '^(Cargo\.toml|Cargo\.lock)$' || true)
          [[ -z "$unexpected" ]] || {
            echo "release preparation changed unexpected files:" >&2
            echo "$unexpected" >&2
            exit 1
          }
          git diff --check

          git add Cargo.toml Cargo.lock
          git diff --cached --quiet && {
            echo "release preparation produced no version changes" >&2
            exit 1
          }
          git -c commit.gpgSign=false commit -m "chore(release): prepare $tag"

          candidate_commit=$(git rev-parse HEAD)
          candidate_branch="release-candidate-${tag}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$candidate_branch"

          echo "base_commit=$base_commit" >> "$GITHUB_OUTPUT"
          echo "candidate_commit=$candidate_commit" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "release_goal=$RELEASE_GOAL" >> "$GITHUB_OUTPUT"
          echo "Prepared $tag from $base_commit as $candidate_commit"

  preflight:
    name: Preflight (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit }}

      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: release-preflight-${{ runner.os }}

      - name: Workspace tests
        run: cargo test --workspace --all-features --locked

  gates:
    name: Release gates
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit }}

      - uses: ./.github/actions/rust-ci-setup
        with:
          components: rustfmt,clippy
          cache-key: release-gates

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build all features
        run: cargo build --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test

      - name: Locked tests
        run: cargo test --locked

  linux-artifacts:
    name: Linux artifacts
    needs: [prepare, preflight, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit }}

      - uses: ./.github/actions/rust-ci-setup
        with:
          target: x86_64-unknown-linux-musl
          install-cross: "true"
          cache-key: release-linux

      - name: Build GNU binary
        run: cargo build --release --locked --package chimera_server_app

      - name: Build musl binary
        run: cross build --release --locked --target x86_64-unknown-linux-musl --package chimera_server_app

      - name: Package Linux artifacts
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/chimera_server_app "dist/chimera_server_app-${TAG}-linux-x86_64"
          cp target/x86_64-unknown-linux-musl/release/chimera_server_app "dist/chimera_server_app-${TAG}-linux-x86_64-musl"
          chmod +x dist/chimera_server_app-*
          (cd dist && sha256sum "chimera_server_app-${TAG}-linux-x86_64" > "chimera_server_app-${TAG}-linux-x86_64.sha256")
          (cd dist && sha256sum "chimera_server_app-${TAG}-linux-x86_64-musl" > "chimera_server_app-${TAG}-linux-x86_64-musl.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ needs.prepare.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  windows-artifacts:
    name: Windows artifacts
    needs: [prepare, preflight, gates]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit }}

      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: release-windows

      - name: Build Windows binary
        run: cargo build --release --locked --package chimera_server_app

      - name: Package Windows artifacts
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $binary = "dist\chimera_server_app-$env:TAG-windows-x86_64.exe"
          Copy-Item target\release\chimera_server_app.exe $binary
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLower()
          "$hash  chimera_server_app-$env:TAG-windows-x86_64.exe" |
            Out-File -Encoding ascii "$binary.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ needs.prepare.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, linux-artifacts, windows-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.candidate_commit }}
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/download-artifact@v5
        with:
          pattern: release-*-${{ needs.prepare.outputs.tag }}
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          expected=(
            "chimera_server_app-${TAG}-linux-x86_64"
            "chimera_server_app-${TAG}-linux-x86_64.sha256"
            "chimera_server_app-${TAG}-linux-x86_64-musl"
            "chimera_server_app-${TAG}-linux-x86_64-musl.sha256"
            "chimera_server_app-${TAG}-windows-x86_64.exe"
            "chimera_server_app-${TAG}-windows-x86_64.exe.sha256"
          )
          for file in "${expected[@]}"; do
            test -f "$file" || {
              echo "missing release artifact: $file" >&2
              exit 1
            }
          done
          sha256sum -c \
            "chimera_server_app-${TAG}-linux-x86_64.sha256" \
            "chimera_server_app-${TAG}-linux-x86_64-musl.sha256" \
            "chimera_server_app-${TAG}-windows-x86_64.exe.sha256"

      - name: Atomically update master and tag
        env:
          BASE_COMMIT: ${{ needs.prepare.outputs.base_commit }}
          CANDIDATE_COMMIT: ${{ needs.prepare.outputs.candidate_commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_GOAL: ${{ needs.prepare.outputs.release_goal }}
        run: |
          set -euo pipefail
          git fetch origin master --tags
          remote_master=$(git rev-parse origin/master)
          [[ "$remote_master" == "$BASE_COMMIT" ]] || {
            echo "master advanced while release validation was running" >&2
            echo "expected: $BASE_COMMIT" >&2
            echo "current:  $remote_master" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_COMMIT" ]] || {
            echo "checked-out candidate changed unexpectedly" >&2
            exit 1
          }
          [[ "$(git rev-parse "$CANDIDATE_COMMIT^")" == "$BASE_COMMIT" ]] || {
            echo "release commit is no longer a direct child of the validated base" >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "release tag appeared while validation was running: $TAG" >&2
            exit 1
          fi

          git -c tag.gpgSign=false tag -a "$TAG" "$CANDIDATE_COMMIT" -m "$TAG: $RELEASE_GOAL"
          git push --atomic origin \
            "$CANDIDATE_COMMIT:refs/heads/master" \
            "refs/tags/$TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }} — ${{ needs.prepare.outputs.release_goal }}
          generate_release_notes: true
          body: |
            Primary protocol goal: ${{ needs.prepare.outputs.release_goal }}
            SemVer increment: ${{ inputs.bump }}
            Previous release baseline: ${{ needs.prepare.outputs.base_version }}

            The workflow created ${{ needs.prepare.outputs.version }} from the validated release candidate and atomically advanced master with the release tag only after Linux/Windows preflight tests, repository release gates, and all platform artifacts passed.
            Validate this release before starting the next primary protocol goal.
          files: |
            dist/chimera_server_app-${{ needs.prepare.outputs.tag }}-linux-x86_64
            dist/chimera_server_app-${{ needs.prepare.outputs.tag }}-linux-x86_64.sha256
            dist/chimera_server_app-${{ needs.prepare.outputs.tag }}-linux-x86_64-musl
            dist/chimera_server_app-${{ needs.prepare.outputs.tag }}-linux-x86_64-musl.sha256
            dist/chimera_server_app-${{ needs.prepare.outputs.tag }}-windows-x86_64.exe
            dist/chimera_server_app-${{ needs.prepare.outputs.tag }}-windows-x86_64.exe.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}

  cleanup:
    name: Cleanup candidate branch
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, preflight, gates, linux-artifacts, windows-artifacts, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base_commit }}
          token: ${{ github.token }}

      - name: Delete candidate branch
        continue-on-error: true
        env:
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
        run: git push origin --delete "$CANDIDATE_BRANCH"
