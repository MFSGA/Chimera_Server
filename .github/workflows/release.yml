name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target stable version without the v prefix, for example 0.7.6"
        required: true
        type: string
      release_goal:
        description: "The single primary protocol goal completed by this version"
        required: true
        type: string
      source_ref:
        description: "Optional historical commit/tag to release; must be an ancestor of master"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_goal: ${{ steps.meta.outputs.release_goal }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.source_ref || github.ref }}
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          RELEASE_GOAL_INPUT: ${{ github.event.inputs.release_goal }}
          SOURCE_REF_INPUT: ${{ github.event.inputs.source_ref }}
        run: |
          set -euo pipefail

          VERSION="$VERSION_INPUT"
          RELEASE_GOAL="$RELEASE_GOAL_INPUT"
          SOURCE_COMMIT=$(git rev-parse HEAD)

          if [[ "$GITHUB_REF_NAME" != "master" ]]; then
            echo "releases must be dispatched from master" >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must use stable SemVer form such as 0.7.6" >&2
            exit 1
          fi

          git fetch origin master --tags
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" origin/master; then
            echo "release source must be an ancestor of master: ${SOURCE_REF_INPUT:-$SOURCE_COMMIT}" >&2
            exit 1
          fi

          if [[ -z "${RELEASE_GOAL// }" ]]; then
            echo "release_goal must describe the single primary protocol goal" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag already exists: $TAG" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_goal=$RELEASE_GOAL" >> "$GITHUB_OUTPUT"
          echo "Preparing $TAG from $SOURCE_COMMIT (dispatched from $GITHUB_REF_NAME): $RELEASE_GOAL"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify prepared workspace version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "chimera_server_app") | .version')
          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "workspace version is $ACTUAL_VERSION, expected $EXPECTED_VERSION" >&2
            echo "prepare and review the version bump before dispatching a release" >&2
            exit 1
          fi

      - name: Format gate
        run: cargo fmt --all -- --check

      - name: Build gate
        run: cargo build --all-features

      - name: Clippy gate
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test gate
        run: cargo test

      - name: Locked dependency gate
        run: cargo test --locked

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: cargo build --release --package chimera_server_app

      - name: Build musl release binary
        run: cross build --release --target x86_64-unknown-linux-musl --package chimera_server_app

      - name: Prepare binary artifacts
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/chimera_server_app "dist/chimera_server_app-${TAG}-linux-x86_64"
          cp target/x86_64-unknown-linux-musl/release/chimera_server_app "dist/chimera_server_app-${TAG}-linux-x86_64-musl"
          chmod +x "dist/chimera_server_app-${TAG}-linux-x86_64"
          chmod +x "dist/chimera_server_app-${TAG}-linux-x86_64-musl"
          (cd dist && sha256sum "chimera_server_app-${TAG}-linux-x86_64" > "chimera_server_app-${TAG}-linux-x86_64.sha256")
          (cd dist && sha256sum "chimera_server_app-${TAG}-linux-x86_64-musl" > "chimera_server_app-${TAG}-linux-x86_64-musl.sha256")
          ls -lh dist

      - name: Create annotated release tag
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_GOAL: ${{ steps.meta.outputs.release_goal }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "$TAG: $RELEASE_GOAL"
          git push origin "$TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }} — ${{ steps.meta.outputs.release_goal }}
          generate_release_notes: true
          body: |
            Primary protocol goal: ${{ steps.meta.outputs.release_goal }}

            This release contains one primary protocol goal and was published only after all repository release gates passed.
            Validate this release before starting the next protocol goal.
          files: |
            dist/chimera_server_app-${{ steps.meta.outputs.tag }}-linux-x86_64
            dist/chimera_server_app-${{ steps.meta.outputs.tag }}-linux-x86_64.sha256
            dist/chimera_server_app-${{ steps.meta.outputs.tag }}-linux-x86_64-musl
            dist/chimera_server_app-${{ steps.meta.outputs.tag }}-linux-x86_64-musl.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-windows:
    runs-on: windows-latest
    needs: release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}
          token: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --package chimera_server_app

      - name: Prepare binary artifacts
        shell: pwsh
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\chimera_server_app.exe "dist\chimera_server_app-$env:TAG-windows-x86_64.exe"
          $hash = (Get-FileHash "dist\chimera_server_app-$env:TAG-windows-x86_64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  chimera_server_app-$env:TAG-windows-x86_64.exe" | Out-File -Encoding ascii "dist\chimera_server_app-$env:TAG-windows-x86_64.exe.sha256"
          Get-ChildItem -Path dist

      - name: Upload Windows binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/chimera_server_app-${{ needs.release.outputs.tag }}-windows-x86_64.exe
            dist/chimera_server_app-${{ needs.release.outputs.tag }}-windows-x86_64.exe.sha256
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
