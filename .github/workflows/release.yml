name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_goal:
        description: "Concise English release highlight, following Xray-core release title style"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      base_commit: ${{ steps.prepare.outputs.base_commit }}
      candidate_commit: ${{ steps.prepare.outputs.candidate_commit }}
      candidate_branch: ${{ steps.prepare.outputs.candidate_branch }}
      workspace_version: ${{ steps.prepare.outputs.workspace_version }}
      latest_tag_version: ${{ steps.prepare.outputs.latest_tag_version }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      release_goal: ${{ steps.prepare.outputs.release_goal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute version and create candidate
        id: prepare
        env:
          RELEASE_GOAL: ${{ inputs.release_goal }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF_NAME" == "master" ]] || {
            echo "releases must be dispatched from master" >&2
            exit 1
          }
          [[ -n "${RELEASE_GOAL// }" && "$RELEASE_GOAL" != *$'\n'* ]] || {
            echo "release_goal must be one non-empty line" >&2
            exit 1
          }

          git fetch origin master --tags
          base_commit=$(git rev-parse origin/master)
          dispatch_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          [[ "$dispatch_commit" == "$base_commit" ]] || {
            echo "master advanced after this release was dispatched" >&2
            echo "dispatch: $dispatch_commit" >&2
            echo "current:  $base_commit" >&2
            echo "dispatch a fresh release from the current master" >&2
            exit 1
          }

          python3 .github/scripts/release_version.py \
            --date "$(date -u +'%Y-%m-%d')" \
            --write \
            --github-output "$GITHUB_OUTPUT"

          version=$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_workspace = 1; next }
            /^\[/ { in_workspace = 0 }
            in_workspace && /^version = / { print $2; exit }
          ' Cargo.toml)
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null || \
             git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "release tag already exists: $tag" >&2
            exit 1
          fi

          # The helper updates only workspace package versions in Cargo.lock. Prove the
          # resulting committed lockfile is self-consistent without allowing dependency drift.
          cargo metadata --format-version 1 --no-deps --locked >/dev/null

          unexpected=$(git diff --name-only | grep -Ev '^(Cargo\.toml|Cargo\.lock)$' || true)
          [[ -z "$unexpected" ]] || {
            echo "release preparation changed unexpected files:" >&2
            echo "$unexpected" >&2
            exit 1
          }
          git diff --check

          git add Cargo.toml Cargo.lock
          git diff --cached --quiet && {
            echo "release preparation produced no version changes" >&2
            exit 1
          }
          git -c commit.gpgSign=false commit -m "chore(release): prepare $tag"

          candidate_commit=$(git rev-parse HEAD)
          candidate_branch="release-candidate-${tag}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "base_commit=$base_commit" >> "$GITHUB_OUTPUT"
          echo "candidate_commit=$candidate_commit" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "release_goal=$RELEASE_GOAL" >> "$GITHUB_OUTPUT"
          echo "Prepared $tag from $base_commit as $candidate_commit"

      - name: Push release candidate to trigger required CI
        env:
          RELEASE_CANDIDATE_TOKEN: ${{ secrets.ADMIN_PAT }}
          CANDIDATE_BRANCH: ${{ steps.prepare.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.prepare.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_BRANCH" == release-candidate-* ]] || {
            echo "refusing to push outside a release-candidate branch" >&2
            exit 1
          }
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "candidate SHA is invalid" >&2
            exit 1
          }
          [[ -n "$RELEASE_CANDIDATE_TOKEN" ]] || {
            echo "the ADMIN_PAT Actions secret is required to trigger push CI" >&2
            exit 1
          }

          # Stop using the read-only checkout token for this push; the token below is
          # scoped to this single candidate-branch operation.
          git config --local --unset-all http.https://github.com/.extraheader || true
          umask 077
          askpass=$(mktemp)
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *) printf '%s\n' "$RELEASE_CANDIDATE_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push origin "$CANDIDATE_SHA:refs/heads/$CANDIDATE_BRANCH"

  candidate-ci:
    name: Candidate required CI
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit }}

      - name: Verify push-triggered CI on the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_commit }}
        run: python3 .github/scripts/release_candidate_ci.py

  preflight:
    name: Preflight (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit }}

      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: release-preflight-${{ runner.os }}

      - name: Workspace tests
        run: cargo test --workspace --all-features --locked

  feature-preflight:
    name: Feature compatibility (${{ matrix.name }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            feature: ""
          - name: minimal-vless
            feature: minimal-vless
          - name: minimal-vless-tls
            feature: minimal-vless-tls
          - name: vless-reverse
            feature: vless-reverse
          - name: vless-reverse-tls
            feature: vless-reverse-tls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit }}

      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: release-feature-${{ matrix.name }}

      - name: Check feature boundary
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          set -euo pipefail
          if [ -n "$FEATURE" ]; then
            cargo check \
              --package chimera_server_app \
              --no-default-features \
              --features "$FEATURE" \
              --locked
          else
            cargo check \
              --package chimera_server_app \
              --locked
          fi

  gates:
    name: Release gates
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit }}

      - uses: ./.github/actions/rust-ci-setup
        with:
          components: rustfmt,clippy
          cache-key: release-gates

      - name: Format
        run: cargo fmt --all -- --check

      - name: Release version helper
        run: python3 .github/scripts/release_version.py --self-test

      - name: Build all features
        run: cargo build --all-features --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test

      - name: Locked tests
        run: cargo test --locked

  linux-artifacts:
    name: Linux artifacts
    needs: [prepare, preflight, feature-preflight, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit }}

      - uses: ./.github/actions/rust-ci-setup
        with:
          target: x86_64-unknown-linux-musl
          install-cross: "true"
          cache-key: release-linux

      - name: Build GNU binary
        run: cargo build --release --locked --package chimera_server_app

      - name: Build musl binary
        run: cross build --release --locked --target x86_64-unknown-linux-musl --package chimera_server_app

      - name: Package Linux artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/staging/linux-64 dist/staging/linux-64-musl

          cp target/release/chimera_server_app dist/staging/linux-64/chimera_server_app
          cp target/x86_64-unknown-linux-musl/release/chimera_server_app \
            dist/staging/linux-64-musl/chimera_server_app
          chmod 0755 dist/staging/linux-64/chimera_server_app \
            dist/staging/linux-64-musl/chimera_server_app

          for package in linux-64 linux-64-musl; do
            cp .github/release-package/README.md LICENSE \
              "examples/xray-compatible/socks-tcp-noauth.json5" \
              "dist/staging/${package}/"
            mv "dist/staging/${package}/socks-tcp-noauth.json5" \
              "dist/staging/${package}/config.example.json5"
          done

          for package in linux-64 linux-64-musl; do
            archive="Chimera-${package}.zip"
            (cd "dist/staging/${package}" && zip -9 -X -r "../../${archive}" .)
            (
              cd dist
              {
                openssl dgst -sha256 "${archive}"
                openssl dgst -sha512 "${archive}"
              } > "${archive}.dgst"
            )
          done

          rm -rf dist/staging

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-${{ needs.prepare.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  windows-artifacts:
    name: Windows artifacts
    needs: [prepare, preflight, feature-preflight, gates]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_commit }}

      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: release-windows

      - name: Build Windows binary
        run: cargo build --release --locked --package chimera_server_app

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $stage = "dist\staging\windows-64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\chimera_server_app.exe "$stage\chimera_server_app.exe"
          $packageFiles = @(
            ".github/release-package/README.md"
            "LICENSE"
            "examples/xray-compatible/socks-tcp-noauth.json5"
          )
          foreach ($packageFile in $packageFiles) {
            Copy-Item -Path $packageFile -Destination $stage
          }
          Move-Item "$stage\socks-tcp-noauth.json5" "$stage\config.example.json5"

          $archiveName = "Chimera-windows-64.zip"
          $archivePath = "dist\$archiveName"
          Compress-Archive -Path "$stage\*" -DestinationPath $archivePath
          $sha256 = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLower()
          $sha512 = (Get-FileHash $archivePath -Algorithm SHA512).Hash.ToLower()
          @(
            "SHA2-256($archiveName)= $sha256"
            "SHA2-512($archiveName)= $sha512"
          ) | Set-Content -Encoding ascii "$archivePath.dgst"
          Remove-Item -Recurse -Force "dist\staging"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-${{ needs.prepare.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, candidate-ci, linux-artifacts, windows-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.candidate_commit }}
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*-${{ needs.prepare.outputs.tag }}
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          expected=(
            "Chimera-linux-64.zip"
            "Chimera-linux-64.zip.dgst"
            "Chimera-linux-64-musl.zip"
            "Chimera-linux-64-musl.zip.dgst"
            "Chimera-windows-64.zip"
            "Chimera-windows-64.zip.dgst"
          )
          for file in "${expected[@]}"; do
            test -f "$file" || {
              echo "missing release artifact: $file" >&2
              exit 1
            }
          done
          for archive in Chimera-linux-64.zip Chimera-linux-64-musl.zip Chimera-windows-64.zip; do
            unzip -t "$archive" >/dev/null
            for algorithm in 256 512; do
              marker="SHA2-${algorithm}(${archive})= "
              expected_digest=$(awk -v marker="$marker" '
                { sub(/\r$/, "", $0) }
                index($0, marker) == 1 { print substr($0, length(marker) + 1); exit }
              ' "${archive}.dgst")
              if [[ "$algorithm" == "256" ]]; then
                valid_digest="$expected_digest" && [[ "$valid_digest" =~ ^[0-9a-f]{64}$ ]]
              else
                valid_digest="$expected_digest" && [[ "$valid_digest" =~ ^[0-9a-f]{128}$ ]]
              fi || {
                echo "missing or malformed SHA2-${algorithm} digest for $archive" >&2
                exit 1
              }
              actual_digest=$(openssl dgst "-sha${algorithm}" "$archive" | awk -F'= ' '{ print $2 }')
              [[ "$actual_digest" == "$expected_digest" ]] || {
                echo "SHA2-${algorithm} verification failed for $archive" >&2
                exit 1
              }
            done
          done

          unzip -Z1 Chimera-linux-64.zip | grep -Fxq chimera_server_app
          unzip -Z1 Chimera-linux-64-musl.zip | grep -Fxq chimera_server_app
          unzip -Z1 Chimera-windows-64.zip | grep -Fxq chimera_server_app.exe
          for archive in Chimera-linux-64.zip Chimera-linux-64-musl.zip Chimera-windows-64.zip; do
            for package_file in README.md LICENSE config.example.json5; do
              unzip -Z1 "$archive" | grep -Fxq "$package_file" || {
                echo "$archive does not contain $package_file" >&2
                exit 1
              }
            done
          done

      - name: Atomically update master and tag
        env:
          BASE_COMMIT: ${{ needs.prepare.outputs.base_commit }}
          CANDIDATE_COMMIT: ${{ needs.prepare.outputs.candidate_commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_GOAL: ${{ needs.prepare.outputs.release_goal }}
        run: |
          set -euo pipefail
          git fetch origin master --tags
          remote_master=$(git rev-parse origin/master)
          [[ "$remote_master" == "$BASE_COMMIT" ]] || {
            echo "master advanced while release validation was running" >&2
            echo "expected: $BASE_COMMIT" >&2
            echo "current:  $remote_master" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_COMMIT" ]] || {
            echo "checked-out candidate changed unexpectedly" >&2
            exit 1
          }
          [[ "$(git rev-parse "$CANDIDATE_COMMIT^")" == "$BASE_COMMIT" ]] || {
            echo "release commit is no longer a direct child of the validated base" >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "release tag appeared while validation was running: $TAG" >&2
            exit 1
          fi

          git -c tag.gpgSign=false tag -a "$TAG" "$CANDIDATE_COMMIT" -m "$TAG: $RELEASE_GOAL"
          git push --atomic origin \
            "$CANDIDATE_COMMIT:refs/heads/master" \
            "refs/tags/$TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Chimera Server ${{ needs.prepare.outputs.tag }}
          generate_release_notes: false
          body: |
            ### Highlights

            - ${{ needs.prepare.outputs.release_goal }}

            ### Downloads

            | Platform | Package |
            | --- | --- |
            | Linux x86_64 (GNU) | [Chimera-linux-64.zip](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/Chimera-linux-64.zip) |
            | Linux x86_64 (musl) | [Chimera-linux-64-musl.zip](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/Chimera-linux-64-musl.zip) |
            | Windows x86_64 | [Chimera-windows-64.zip](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/Chimera-windows-64.zip) |

            Each `.zip` contains the executable, README, license, and a minimal example configuration. The matching `.dgst` file contains SHA-256 and SHA-512 digests.

            ### Compatibility

            Compatibility varies by protocol, transport, security, and network combination. See the [compatibility matrix](https://github.com/${{ github.repository }}/blob/master/COMPATIBILITY.md) before upgrading.
            Validate this release in deployment before starting the next primary protocol goal.

            ### Full changelog

            ${{ needs.prepare.outputs.latest_tag_version != '' && format('https://github.com/{0}/compare/v{1}...{2}', github.repository, needs.prepare.outputs.latest_tag_version, needs.prepare.outputs.tag) || format('https://github.com/{0}/commits/{1}', github.repository, needs.prepare.outputs.tag) }}
          files: |
            dist/Chimera-linux-64.zip
            dist/Chimera-linux-64.zip.dgst
            dist/Chimera-linux-64-musl.zip
            dist/Chimera-linux-64-musl.zip.dgst
            dist/Chimera-windows-64.zip
            dist/Chimera-windows-64.zip.dgst
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  cleanup:
    name: Cleanup candidate branch
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, candidate-ci, preflight, feature-preflight, gates, linux-artifacts, windows-artifacts, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_commit }}
          token: ${{ github.token }}

      - name: Delete candidate branch
        continue-on-error: true
        env:
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
        run: git push origin --delete "$CANDIDATE_BRANCH"
