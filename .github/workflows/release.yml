name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version without the v prefix, for example 0.8.1"
        required: true
        type: string
      release_goal:
        description: "Single primary protocol goal completed by this version"
        required: true
        type: string
      source_ref:
        description: "Optional historical commit/tag; must be an ancestor of master"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  candidate:
    name: Resolve candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.meta.outputs.source_commit }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_goal: ${{ steps.meta.outputs.release_goal }}
      tag_preexists: ${{ steps.meta.outputs.tag_preexists }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve metadata
        id: meta
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_GOAL_INPUT: ${{ inputs.release_goal }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          version="$VERSION_INPUT"
          release_goal="$RELEASE_GOAL_INPUT"

          [[ "$GITHUB_REF_NAME" == "master" ]] || {
            echo "releases must be dispatched from master" >&2
            exit 1
          }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must use stable SemVer form such as 0.8.1" >&2
            exit 1
          }
          [[ -n "${release_goal// }" ]] || {
            echo "release_goal must describe the single primary protocol goal" >&2
            exit 1
          }

          git fetch origin master --tags
          if [[ -n "$SOURCE_REF_INPUT" ]]; then
            source_commit=$(git rev-parse --verify "$SOURCE_REF_INPUT^{commit}") || {
              echo "unable to resolve release source: $SOURCE_REF_INPUT" >&2
              exit 1
            }
          else
            source_commit=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
          fi

          git merge-base --is-ancestor "$source_commit" origin/master || {
            echo "release source must be an ancestor of master: ${SOURCE_REF_INPUT:-$source_commit}" >&2
            exit 1
          }

          tag="v${version}"
          tag_preexists=false
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_commit=$(git rev-parse "$tag^{commit}")
            [[ "$tag_commit" == "$source_commit" ]] || {
              echo "tag $tag points to $tag_commit, expected $source_commit" >&2
              exit 1
            }
            tag_preexists=true
          fi

          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_goal=$release_goal" >> "$GITHUB_OUTPUT"
          echo "tag_preexists=$tag_preexists" >> "$GITHUB_OUTPUT"
          echo "Candidate: $tag @ $source_commit — $release_goal"

      - name: Check workspace version
        env:
          SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_COMMIT"
          actual_version=$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_workspace = 1; next }
            /^\[/ { in_workspace = 0 }
            in_workspace && /^version = / { print $2; exit }
          ' Cargo.toml)
          [[ "$actual_version" == "$EXPECTED_VERSION" ]] || {
            echo "workspace version is $actual_version, expected $EXPECTED_VERSION" >&2
            exit 1
          }

  preflight:
    name: Preflight (${{ matrix.os }})
    needs: candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.source_commit }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-preflight-${{ runner.os }}

      - name: Workspace tests
        run: cargo test --workspace --all-features --locked

  gates:
    name: Release gates
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.source_commit }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-gates

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build all features
        run: cargo build --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test

      - name: Locked tests
        run: cargo test --locked

  linux-artifacts:
    name: Linux artifacts
    needs: [candidate, preflight, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.source_commit }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux

      - name: Install pinned cross
        run: |
          cargo install cross \
            --git https://github.com/cross-rs/cross \
            --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 \
            --locked

      - name: Build GNU binary
        run: cargo build --release --locked --package chimera_server_app

      - name: Build musl binary
        run: cross build --release --locked --target x86_64-unknown-linux-musl --package chimera_server_app

      - name: Package Linux artifacts
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/chimera_server_app "dist/chimera_server_app-${TAG}-linux-x86_64"
          cp target/x86_64-unknown-linux-musl/release/chimera_server_app "dist/chimera_server_app-${TAG}-linux-x86_64-musl"
          chmod +x dist/chimera_server_app-*
          (cd dist && sha256sum "chimera_server_app-${TAG}-linux-x86_64" > "chimera_server_app-${TAG}-linux-x86_64.sha256")
          (cd dist && sha256sum "chimera_server_app-${TAG}-linux-x86_64-musl" > "chimera_server_app-${TAG}-linux-x86_64-musl.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ needs.candidate.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  windows-artifacts:
    name: Windows artifacts
    needs: [candidate, preflight, gates]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.source_commit }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows

      - name: Build Windows binary
        run: cargo build --release --locked --package chimera_server_app

      - name: Package Windows artifacts
        shell: pwsh
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $binary = "dist\chimera_server_app-$env:TAG-windows-x86_64.exe"
          Copy-Item target\release\chimera_server_app.exe $binary
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLower()
          "$hash  chimera_server_app-$env:TAG-windows-x86_64.exe" |
            Out-File -Encoding ascii "$binary.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ needs.candidate.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [candidate, linux-artifacts, windows-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.source_commit }}
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/download-artifact@v5
        with:
          pattern: release-*-${{ needs.candidate.outputs.tag }}
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          expected=(
            "chimera_server_app-${TAG}-linux-x86_64"
            "chimera_server_app-${TAG}-linux-x86_64.sha256"
            "chimera_server_app-${TAG}-linux-x86_64-musl"
            "chimera_server_app-${TAG}-linux-x86_64-musl.sha256"
            "chimera_server_app-${TAG}-windows-x86_64.exe"
            "chimera_server_app-${TAG}-windows-x86_64.exe.sha256"
          )
          for file in "${expected[@]}"; do
            test -f "$file" || {
              echo "missing release artifact: $file" >&2
              exit 1
            }
          done
          sha256sum -c \
            "chimera_server_app-${TAG}-linux-x86_64.sha256" \
            "chimera_server_app-${TAG}-linux-x86_64-musl.sha256" \
            "chimera_server_app-${TAG}-windows-x86_64.exe.sha256"

      - name: Create annotated tag
        if: needs.candidate.outputs.tag_preexists != 'true'
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
          RELEASE_GOAL: ${{ needs.candidate.outputs.release_goal }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "$TAG: $RELEASE_GOAL"
          git push origin "$TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.candidate.outputs.tag }}
          name: ${{ needs.candidate.outputs.tag }} — ${{ needs.candidate.outputs.release_goal }}
          generate_release_notes: true
          body: |
            Primary protocol goal: ${{ needs.candidate.outputs.release_goal }}

            Published from ${{ needs.candidate.outputs.source_commit }} only after Linux/Windows preflight tests, repository release gates, and all platform artifacts passed.
            Validate this release before starting the next primary protocol goal.
          files: |
            dist/chimera_server_app-${{ needs.candidate.outputs.tag }}-linux-x86_64
            dist/chimera_server_app-${{ needs.candidate.outputs.tag }}-linux-x86_64.sha256
            dist/chimera_server_app-${{ needs.candidate.outputs.tag }}-linux-x86_64-musl
            dist/chimera_server_app-${{ needs.candidate.outputs.tag }}-linux-x86_64-musl.sha256
            dist/chimera_server_app-${{ needs.candidate.outputs.tag }}-windows-x86_64.exe
            dist/chimera_server_app-${{ needs.candidate.outputs.tag }}-windows-x86_64.exe.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}
