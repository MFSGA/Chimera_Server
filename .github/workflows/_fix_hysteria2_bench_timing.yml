name: Fix Hysteria2 benchmark timing

on:
  push:
    branches:
      - perf/hysteria2-netem-benchmark

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.event.head_commit.message == 'ci: fix hy2 benchmark timing' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/hysteria2-netem-benchmark
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply timing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          bench = Path('bench/hysteria2_netem.py')
          text = bench.read_text()
          replacements = [
              (
                  'SYNC_BYTE = b"\\xAC"\nDEFAULT_MODES',
                  'SYNC_BYTE = b"\\xAC"\nDOWNLOAD_GO = b"\\xAD"\nDEFAULT_MODES',
              ),
              (
                  '''    first = sock.recv(65536)\n    if not first:\n        raise RuntimeError("connection closed before benchmark sync byte")\n    sync_index = first.find(SYNC_BYTE)\n    if sync_index < 0:\n        raise RuntimeError(f"missing benchmark sync byte in first response ({len(first)} bytes)")\n    upload_end = time.perf_counter()\n    received = len(first) - sync_index - 1\n\n    download_start = time.perf_counter()\n    while received < payload_size:\n''',
                  '''    sync = sock.recv(1)\n    if sync != SYNC_BYTE:\n        raise RuntimeError(f"missing benchmark sync byte: {sync!r}")\n    upload_end = time.perf_counter()\n\n    # Keep the echo payload behind an explicit GO byte so no response bytes can\n    # be buffered before the download timer starts. Starting before sendall()\n    # makes the directional measurements symmetric: upload includes the sync\n    # response path, download includes the GO request path.\n    download_start = time.perf_counter()\n    sock.sendall(DOWNLOAD_GO)\n    received = 0\n    while received < payload_size:\n''',
              ),
              (
                  '''            conn.sendall(SYNC_BYTE)\n            conn.sendall(data)\n''',
                  '''            conn.sendall(SYNC_BYTE)\n            if conn.recv(1) != DOWNLOAD_GO:\n                return 4\n            conn.sendall(data)\n''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one benchmark replacement, found {text.count(old)}')
              text = text.replace(old, new, 1)
          bench.write_text(text)

          workflow = Path('.github/workflows/proxy-throughput.yml')
          text = workflow.read_text()
          old = '''              repo: context.repo.repo,\n              issue_number: context.issue.number,\n              comment_id: existing.id,\n'''
          new = '''              repo: context.repo.repo,\n              comment_id: existing.id,\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Octokit cleanup, found {text.count(old)}')
          workflow.write_text(text.replace(old, new, 1))
          PY

          python3 -m py_compile bench/hysteria2_netem.py
          python3 bench/hysteria2_netem.py --self-test
          rm .github/workflows/_fix_hysteria2_bench_timing.yml
          git add bench/hysteria2_netem.py .github/workflows/proxy-throughput.yml .github/workflows/_fix_hysteria2_bench_timing.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'bench(hysteria2): isolate download timing'
          git push origin HEAD
