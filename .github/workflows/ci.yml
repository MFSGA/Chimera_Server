name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-ci-setup
        with:
          components: rustfmt,clippy
          cache-key: lint

      - name: Format
        run: cargo fmt --all -- --check

      - name: Release version helper
        run: python3 .github/scripts/release_version.py --self-test

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: test-${{ runner.os }}

      - name: Workspace tests
        run: cargo test --workspace --all-features --locked

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            tool: cargo
          - name: linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            tool: cross
          - name: windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            tool: cargo
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-ci-setup
        with:
          target: ${{ matrix.target }}
          cache-key: build-${{ matrix.target }}
          install-cross: ${{ matrix.tool == 'cross' }}

      - name: Build release target
        env:
          BUILD_TOOL: ${{ matrix.tool }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          "$BUILD_TOOL" build \
            --release \
            --locked \
            --target "$TARGET" \
            --package chimera_server_app
