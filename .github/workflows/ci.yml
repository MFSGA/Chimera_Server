name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/rust-ci-setup
        with:
          components: rustfmt,clippy
          cache-key: lint

      - name: Format
        run: cargo fmt --all -- --check

      - name: Release version helper
        run: python3 .github/scripts/release_version.py --self-test

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: test-${{ runner.os }}

      - name: Workspace tests
        run: cargo test --workspace --all-features --locked

  feature-matrix:
    name: Feature compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            feature: ""
          - name: minimal-vless
            feature: minimal-vless
          - name: minimal-vless-tls
            feature: minimal-vless-tls
          - name: vless-reverse
            feature: vless-reverse
          - name: vless-reverse-tls
            feature: vless-reverse,tls
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: feature-${{ matrix.feature }}

      - name: Check feature boundary
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          set -euo pipefail
          if [ -n "$FEATURE" ]; then
            cargo check \
              --package chimera_server_app \
              --no-default-features \
              --features "$FEATURE" \
              --locked
          else
            cargo check \
              --package chimera_server_app \
              --locked
          fi

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            tool: cargo
          - name: linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            tool: cross
          - name: windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            tool: cargo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/rust-ci-setup
        with:
          target: ${{ matrix.target }}
          cache-key: build-${{ matrix.target }}
          install-cross: ${{ matrix.tool == 'cross' }}

      - name: Build release target
        env:
          BUILD_TOOL: ${{ matrix.tool }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          "$BUILD_TOOL" build \
            --release \
            --locked \
            --target "$TARGET" \
            --package chimera_server_app
