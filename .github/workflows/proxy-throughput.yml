name: Proxy Throughput

on:
  pull_request:
    branches: ["master"]
    paths:
      - "chimera_server_app/**"
      - "chimera_server_lib/src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "bench/**"
      - ".github/actions/**"
      - ".github/workflows/proxy-throughput.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Proxy throughput
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: benchmark-throughput

      - uses: ./.github/actions/setup-pinned-xray

      - name: Build Chimera release
        run: cargo build --release --locked --package chimera_server_app --all-features

      - name: Record environment
        run: |
          {
            echo "### Environment"
            echo "OS: $(uname -a)"
            echo "CPUs: $(nproc)"
            echo "Memory: $(free -h | awk '/^Mem:/ {print $2}')"
            echo "Rustc: $(rustc --version)"
            echo "Cargo: $(cargo --version)"
            echo "Chimera: $(./target/release/chimera_server_app --version 2>&1 || echo 'N/A')"
            echo "Xray: $(./xray/xray version 2>&1 | head -1)"
          } | tee target/throughput-environment.txt

      - name: Run throughput benchmark
        run: |
          python3 bench/throughput.py \
            --only all \
            --payload-size 33554432 \
            --runs 3 \
            --chimera-bin ./target/release/chimera_server_app \
            --xray-bin ./xray/xray \
            --baseline bench/baseline-throughput.json \
            --output target/throughput-results.jsonl \
            --verbose \
            2>&1 | tee target/throughput-run.log

      - name: Generate report
        if: always()
        run: |
          ENV_JSON=$(python3 -c "import json,platform,os; print(json.dumps({'os':{'system':platform.system(),'release':platform.release(),'machine':platform.machine()},'cpu_cores':os.cpu_count()}))")
          python3 bench/format_throughput.py target/throughput-results.jsonl \
            --output target/throughput-report.md \
            --env-json "$ENV_JSON" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat target/throughput-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proxy-throughput
          path: |
            target/throughput-results.jsonl
            target/throughput-report.md
            target/throughput-run.log
            target/throughput-environment.txt
          if-no-files-found: warn
          retention-days: 90

  comment:
    name: Update throughput PR comment
    needs: benchmark
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download benchmark report
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: proxy-throughput
          path: target

      - name: Update PR comment
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- chimera-proxy-throughput -->';
            const report = 'target/throughput-report.md';
            let body = fs.existsSync(report)
              ? fs.readFileSync(report, 'utf8')
              : '## Proxy Throughput Report\n\nNo report was produced. See the workflow run for details.';
            body = `${marker}\n${body}\n\n[View workflow run and artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              comment => comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
