name: Hysteria2 Brutal validation

on:
  push:
    branches: [codex/hysteria2-brutal-post-auth]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: arduino/setup-protoc@v3
        with:
          version: "23.x"
      - uses: Swatinem/rust-cache@v2
      - name: Focused Brutal tests
        run: cargo test -p chimera_server_lib brutal_
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build all features
        run: cargo build --all-features
      - name: Clippy all targets and features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test
      - name: Test locked
        run: cargo test --locked
      - name: Download Xray 26.2.6
        run: |
          curl -fL --retry 3 \
            https://github.com/XTLS/Xray-core/releases/download/v26.2.6/Xray-linux-64.zip \
            -o /tmp/xray-26.2.6.zip
          mkdir -p xray-26.2.6
          unzip -q /tmp/xray-26.2.6.zip -d xray-26.2.6
          chmod +x xray-26.2.6/xray
          ./xray-26.2.6/xray version
      - name: Xray 26.2.6 Brutal TCP and UDP interop
        env:
          XRAY_BIN: xray-26.2.6/xray
        run: |
          cargo test -p chimera_server_app --test xray_client_proxy_e2e \
            xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2 \
            -- --ignored --exact --nocapture
      - name: Download repository-pinned Xray
        run: |
          VERSION=$(cat bench/.xray-version)
          curl -fL --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/${VERSION}/Xray-linux-64.zip" \
            -o /tmp/xray-current.zip
          mkdir -p xray-current
          unzip -q /tmp/xray-current.zip -d xray-current
          chmod +x xray-current/xray
          ./xray-current/xray version
      - name: Repository-pinned Xray Brutal TCP and UDP interop
        env:
          XRAY_BIN: xray-current/xray
        run: |
          cargo test -p chimera_server_app --test xray_client_proxy_e2e \
            xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2 \
            -- --ignored --exact --nocapture
