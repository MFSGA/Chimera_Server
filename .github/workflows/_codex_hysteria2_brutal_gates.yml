name: Hysteria2 latest Xray validation

on:
  push:
    branches: [codex/hysteria2-brutal-post-auth]

jobs:
  latest-xray-interop:
    name: Xray v26.7.28 / ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: master
            ref: master
          - label: pr16
            ref: codex/hysteria2-brutal-post-auth
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "23.x"
      - uses: Swatinem/rust-cache@v2
      - name: Provision temporary test certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout cert/key.pem -out cert/cert.pem -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      - name: Download and verify Xray v26.7.28
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip \
            -o /tmp/Xray-linux-64-v26.7.28.zip
          echo "8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40  /tmp/Xray-linux-64-v26.7.28.zip" | sha256sum -c -
          mkdir -p xray-v26.7.28
          unzip -q /tmp/Xray-linux-64-v26.7.28.zip -d xray-v26.7.28
          chmod +x xray-v26.7.28/xray
          cp xray-v26.7.28/xray ./xray
          chmod +x ./xray
          ./xray version
      - name: Hysteria2 Brutal TCP and UDP interop
        env:
          XRAY_BIN: ${{ github.workspace }}/xray
        run: |
          cargo test -p chimera_server_app --test xray_client_proxy_e2e \
            xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2 \
            -- --ignored --exact --nocapture
