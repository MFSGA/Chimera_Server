name: Hysteria2 Xray 26.2.6 control

on:
  push:
    branches: [codex/hysteria2-brutal-post-auth]

jobs:
  xray-interop:
    name: Xray v26.2.6 / ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: master
            ref: master
          - label: pr16
            ref: codex/hysteria2-brutal-post-auth
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "23.x"
      - uses: Swatinem/rust-cache@v2
      - name: Provision temporary test certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout cert/key.pem -out cert/cert.pem -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      - name: Download and verify Xray v26.2.6
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/Xray-linux-64-v26.2.6.zip
          curl -fL --retry 3 \
            https://github.com/XTLS/Xray-core/releases/download/v26.2.6/Xray-linux-64.zip \
            -o "$archive"
          echo "29ce535b56e207a406ffa1c2d4842dcc410be003eff8ec508bb732abc9f8e385  ${archive}" | sha256sum -c -
          mkdir -p xray-test
          unzip -q "$archive" -d xray-test
          chmod +x xray-test/xray
          cp xray-test/xray ./xray
          chmod +x ./xray
          ./xray version
      - name: Hysteria2 Brutal TCP and UDP interop
        shell: bash
        env:
          XRAY_BIN: ${{ github.workspace }}/xray
          RUST_BACKTRACE: "1"
        run: |
          set +e
          cargo test -p chimera_server_app --test xray_client_proxy_e2e \
            xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2 \
            -- --ignored --exact --nocapture
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== Hysteria2 e2e diagnostic files ==="
            find /tmp -type f -path '*hysteria2*' \
              \( -name '*.log' -o -name '*.json' -o -name '*.json5' \) \
              -print -exec sh -c 'echo "--- $1 ---"; tail -n 300 "$1"' _ {} \; || true
          fi
          exit "$status"
