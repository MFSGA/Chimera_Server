name: Hysteria2 Xray version validation

on:
  push:
    branches: [codex/hysteria2-brutal-post-auth]

jobs:
  xray-interop:
    name: Xray ${{ matrix.version }} / ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: master
            ref: master
            version: v26.7.28
            sha256: 8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40
          - label: pr16
            ref: codex/hysteria2-brutal-post-auth
            version: v26.7.28
            sha256: 8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40
          - label: master
            ref: master
            version: v26.3.27
            sha256: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
          - label: pr16
            ref: codex/hysteria2-brutal-post-auth
            version: v26.3.27
            sha256: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "23.x"
      - uses: Swatinem/rust-cache@v2
      - name: Provision temporary test certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout cert/key.pem -out cert/cert.pem -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      - name: Download and verify Xray
        shell: bash
        env:
          XRAY_VERSION: ${{ matrix.version }}
          XRAY_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="/tmp/Xray-linux-64-${XRAY_VERSION}.zip"
          curl -fL --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            -o "$archive"
          echo "${XRAY_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p xray-test
          unzip -q "$archive" -d xray-test
          chmod +x xray-test/xray
          cp xray-test/xray ./xray
          chmod +x ./xray
          ./xray version
      - name: Hysteria2 Brutal TCP and UDP interop
        shell: bash
        env:
          XRAY_BIN: ${{ github.workspace }}/xray
          RUST_BACKTRACE: "1"
        run: |
          set +e
          cargo test -p chimera_server_app --test xray_client_proxy_e2e \
            xray_client_can_proxy_tcp_and_udp_through_chimera_hysteria2 \
            -- --ignored --exact --nocapture
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== Hysteria2 e2e diagnostic files ==="
            find /tmp -type f -path '*hysteria2*' \
              \( -name '*.log' -o -name '*.json' -o -name '*.json5' \) \
              -print -exec sh -c 'echo "--- $1 ---"; tail -n 300 "$1"' _ {} \; || true
          fi
          exit "$status"
