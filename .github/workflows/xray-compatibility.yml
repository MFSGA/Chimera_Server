name: Xray Compatibility Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never

jobs:
  compatibility-smoke:
    name: Pinned Xray client smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check dispatch ref
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Select master when dispatching this workflow." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: compatibility-smoke

      - uses: ./.github/actions/setup-pinned-xray

      - name: Record compatibility baseline
        run: |
          set -euo pipefail
          xray_version=$(./xray/xray version | sed -n '1p')
          xray_source_commit=$(git rev-parse HEAD:ref/xray-core)
          {
            echo "## Xray compatibility smoke"
            echo "- Xray client: $xray_version"
            echo "- Client version source: bench/.xray-version"
            echo "- Xray source reference commit: $xray_source_commit"
            echo "- Scope: VLESS over TCP, gRPC, and HTTPUpgrade with a local TCP echo target"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run real Xray client smoke tests
        env:
          XRAY_BIN: ${{ github.workspace }}/xray/xray
        run: |
          set -euo pipefail
          mkdir -p target/xray-compatibility-smoke

          run_case() {
            local test_name="$1"
            local log_file="target/xray-compatibility-smoke/${test_name}.log"

            echo "Running ${test_name} with $(./xray/xray version | sed -n '1p')"
            if ! cargo test \
              --locked \
              --package chimera_server_app \
              --test xray_client_proxy_e2e \
              "$test_name" \
              -- \
              --ignored \
              --exact \
              --nocapture \
              2>&1 | tee "$log_file"; then
              return 1
            fi

            if ! grep -Fq "test ${test_name} ... ok" "$log_file"; then
              echo "Expected exact test did not report success: ${test_name}" >&2
              return 1
            fi
          }

          run_case xray_client_can_proxy_tcp_through_chimera_vless_tcp
          run_case xray_client_can_proxy_tcp_through_chimera_grpc
          run_case xray_client_can_proxy_tcp_through_chimera_httpupgrade

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xray-compatibility-smoke
          path: target/xray-compatibility-smoke/*.log
          if-no-files-found: warn
          retention-days: 30
