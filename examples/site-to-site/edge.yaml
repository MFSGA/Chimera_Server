# Edge / Reverse Bridge. Replace the placeholder ID, Hub name, and CA path.
log:
  loglevel: warning

inbounds: []

outbounds:
  - tag: edge-a-bridge
    protocol: vless
    settings:
      address: hub.example.net
      port: 443
      id: 11111111-1111-4111-8111-111111111111
      encryption: none
      reverse:
        tag: edge-a-bridge
        siteToSite:
          prefixMaps:
            - from: 10.44.0.0/24
              to: 192.168.50.0/24
            - from: fd44:44:0::/64
              to: fd50:50::/64
          allow:
            - network: [tcp]
              ip: [192.168.50.0/24, fd50:50::/64]
              ports: ["22", "443"]
            - network: [tcp, udp]
              ip: [192.168.50.0/24, fd50:50::/64]
              ports: ["53"]
    streamSettings:
      network: tcp
      security: tls
      tlsSettings:
        serverName: hub.example.net

  - tag: lan-direct
    protocol: freedom
    settings:
      finalRules:
        - action: allow
          network: [tcp]
          ip: [192.168.50.0/24, fd50:50::/64]
          port: "22,443"
        - action: allow
          network: [tcp, udp]
          ip: [192.168.50.0/24, fd50:50::/64]
          port: "53"

routing:
  rules:
    - type: field
      inboundTag: [edge-a-bridge]
      network: [tcp, udp]
      outboundTag: lan-direct
